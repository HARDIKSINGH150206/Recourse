version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major bumps need a planned migration (zod 4, typescript 6, node types, and the hash-critical
    # json-canonicalize); do them by hand, never as a drive-by bot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
