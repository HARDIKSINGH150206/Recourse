name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:secrets
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Dashboard builds
        run: pnpm --filter @recourse/dashboard build
      - name: Benchmark smoke (rules-only configs, no model)
        run: pnpm bench:gen && pnpm bench -- --config A1,A2
      - name: Test vectors are up to date
        run: pnpm vectors && git diff --exit-code packages/shared/test/vectors.json

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - run: bash scripts/install-contract-deps.sh
      - run: forge build --root contracts
      - run: forge test --root contracts -vvv
